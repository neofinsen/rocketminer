name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Rocketminer installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('desktop-manual-{0}', github.run_number) }}
          releaseName: "Rocketminer Desktop ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual {0}', github.run_number) }}"
          releaseBody: "Windows desktop build for Rocketminer."
          releaseDraft: true
          prerelease: false
